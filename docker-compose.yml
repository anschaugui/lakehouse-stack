services:
  minio:
    image: rustfs/rustfs:latest
    container_name: lakehouse-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse-net
    restart: unless-stopped

  spark-connect:
    image: apache/spark:3.5.3
    container_name: lakehouse-spark
    user: root
    depends_on:
      - minio
    ports:
      - "15002:15002"
      - "4040:4040"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    command: >
      /opt/spark/bin/spark-submit
      --class org.apache.spark.sql.connect.service.SparkConnectServer
      --packages org.apache.spark:spark-connect_2.12:3.5.3,io.delta:delta-spark_2.12:3.2.0,org.apache.hadoop:hadoop-aws:3.3.4
      --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
      --conf spark.hadoop.fs.s3a.access.key=${MINIO_ROOT_USER}
      --conf spark.hadoop.fs.s3a.secret.key=${MINIO_ROOT_PASSWORD}
      --conf spark.hadoop.fs.s3a.path.style.access=true
      --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
      --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
      --conf spark.driver.memory=8g
      --conf spark.executor.memory=16g
    volumes:
      - ./spark/conf:/opt/spark/conf-custom
    networks:
      - lakehouse-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lakehouse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    restart: unless-stopped

    airflow:
    image: apache/airflow:2.10.3-python3.12
    container_name: lakehouse-airflow
    restart: unless-stopped
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "lakehouse_airflow_secret_key"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "admin"
      _AIRFLOW_WWW_USER_PASSWORD: "admin"
      _PIP_ADDITIONAL_REQUIREMENTS: "pyspark==3.5.3 pyarrow==17.0.0 pandas<3.0.0 grpcio==1.67.1 grpcio-status==1.67.1 googleapis-common-protos psycopg2-binary python-dotenv boto3 requests"
      PYTHONPATH: "/opt/airflow/src"
      SPARK_HOST: "spark-connect"
      POSTGRES_HOST: "postgres"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: "http://minio:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"
    command: standalone
    depends_on:
      - spark-connect
      - postgres
    networks:
      - lakehouse-net
  notebook:
    build: ./notebooks
    container_name: lakehouse-notebook
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      PYTHONPATH: "/home/jovyan/src"
      SPARK_HOST: "spark-connect"
      POSTGRES_HOST: "postgres"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: "http://minio:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./notebooks/work:/home/jovyan/work
      - ./src:/home/jovyan/src
      - ./data:/home/jovyan/data
    depends_on:
      - spark-connect
    networks:
      - lakehouse-net


volumes:
  minio_data:
  postgres_data:

networks:
  lakehouse-net:
    driver: bridge